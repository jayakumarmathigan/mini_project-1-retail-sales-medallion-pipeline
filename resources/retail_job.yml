resources:
  jobs:
    retail_lakehouse_job:
      name: retail_lakehouse_pipeline

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: batch
          default: "1"

      # No cluster is defined, so these notebook tasks use serverless compute
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
        - task_key: bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestion.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_transform.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/03_gold_aggregates.py
        - task_key: quality_checks
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/04_data_quality_checks.py
